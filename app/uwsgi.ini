[uwsgi]
module = main
callable = app
# 单个大仓 clone 会让一个 git-upload-pack worker 占用上百秒，默认 listen
# backlog 只有 100，并发 clone 时 accept 队列溢出，nginx 直接回 502。
# 详见 opensourceways/ascend-ci-deployment#2463。
#
# 注意：内核会用 net.core.somaxconn 对 backlog 封顶（线上 pod 内实测 128），
# 要真正吃到 1024 需要节点侧同时调大该值。
listen = 1024
# 多 worker 同时 accept 时避免惊群导致连接被丢弃
thunder-lock = true
